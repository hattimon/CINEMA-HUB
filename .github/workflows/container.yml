name: Test and publish container
on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      IMAGE: ghcr.io/hattimon/cinema-hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Raspberry Pi installer syntax
        run: sh -n install-raspberry-pi.sh
      - id: version
        name: Read release version
        run: |
          version=$(node -p "require('./package.json').version")
          apk_version=$(node -p "require('./package.json').androidTvClientVersion")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$apk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "apk_version=$apk_version" >> "$GITHUB_OUTPUT"
      - name: Verify Android TV APK is available to Docker
        env:
          APK_VERSION: ${{ steps.version.outputs.apk_version }}
        run: |
          apk="releases/CinemaHub-AndroidTV-v$APK_VERSION.apk"
          test -s "$apk"
          grep -Fxq "!$apk" .dockerignore
          grep -Fq "COPY $apk ./clients/CinemaHub-AndroidTV-v$APK_VERSION.apk" Dockerfile
          (cd releases && sha256sum -c "SHA256SUMS-AndroidTV-v$APK_VERSION.txt")
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: release
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Build isolated integration test image
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --target ci_test --platform "linux/$ARCH" --load \
            --cache-from "type=gha,scope=$ARCH" \
            --tag "$IMAGE:$VERSION-$ARCH-test" .
      - name: Test application in native container
        timeout-minutes: 25
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --cpus 4 --memory 3g --shm-size 512m --pids-limit 512 \
            -e NODE_ENV=test -e BROWSER_CLOSE_AFTER_WORK=true \
            "$IMAGE:$VERSION-$ARCH-test" \
            sh -c 'Xvfb :99 -screen 0 1600x1200x24 -nolisten tcp >/tmp/test-xvfb.log 2>&1 & exec node --test --test-concurrency=1 --test-force-exit --test-timeout=900000 tests/*.test.mjs'
  publish_arch:
    if: github.ref_type == 'tag'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        name: Validate release ref
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated architecture
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: release
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: ghcr.io/hattimon/cinema-hub:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
  publish:
    if: github.ref_type == 'tag'
    needs: publish_arch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/hattimon/cinema-hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 and arm64 manifest
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker buildx imagetools create --tag "$IMAGE:$version" --tag "$IMAGE:latest" \
            "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          docker buildx imagetools inspect "$IMAGE:$version"
          docker buildx imagetools inspect --raw "$IMAGE:$version" | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]
          '
  release:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build and package exactly the tested release commit
        run: |
          version=$(node -p "require('./package.json').version")
          apk_version=$(node -p "require('./package.json').androidTvClientVersion")
          test "$GITHUB_REF_NAME" = "v$version"
          [[ "$apk_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          npm ci --no-audit --no-fund
          npm run build
          pwsh -File ./ops/package-server.ps1
          (cd releases && sha256sum -c "SHA256SUMS-Server-v$version.txt")
          (cd releases && sha256sum -c "SHA256SUMS-AndroidTV-v$apk_version.txt")
          test "$(jq -r '.androidTvClient.version' "releases/CinemaHub-v$version-manifest.json")" = "$apk_version"
          jq '.status = "published" | .image.published = true' "releases/CinemaHub-v$version-manifest.json" > "releases/release-manifest.tmp"
          mv "releases/release-manifest.tmp" "releases/CinemaHub-v$version-manifest.json"
      - name: Publish GitHub Release after both architectures pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          apk_version=$(node -p "require('./package.json').androidTvClientVersion")
          gh release create "v$version" --verify-tag --latest \
            --title "Cinema Hub $version" \
            --notes-file "docs/RELEASE-$version.md" \
            "releases/CinemaHub-Server-v$version.zip" \
            "releases/SHA256SUMS-Server-v$version.txt" \
            "releases/CinemaHub-AndroidTV-v$apk_version.apk" \
            "releases/SHA256SUMS-AndroidTV-v$apk_version.txt" \
            "releases/CinemaHub-v$version-manifest.json"
