name: Test and publish container
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      IMAGE: ghcr.io/hattimon/cinema-hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        name: Read release version
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$GITHUB_REF_TYPE" = tag ]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Test application in native container
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm --cpus 2 --memory 1536m --shm-size 256m --pids-limit 512 \
            --entrypoint sh --mount "type=bind,source=$GITHUB_WORKSPACE/tests,target=/app/tests,readonly" \
            -e NODE_ENV=test -e BROWSER_CLOSE_AFTER_WORK=true "$IMAGE:$VERSION-$ARCH" \
            -c 'Xvfb :99 -screen 0 1600x1200x24 -nolisten tcp >/tmp/test-xvfb.log 2>&1 & exec node --test tests/app.test.mjs tests/totp.test.mjs tests/vider.test.mjs'
      - name: Push tested architecture
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARCH: ${{ matrix.arch }}
        run: docker push "$IMAGE:$VERSION-$ARCH"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/hattimon/cinema-hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish amd64 and arm64 manifest
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          docker buildx imagetools create --tag "$IMAGE:$version" --tag "$IMAGE:latest" \
            "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
          docker buildx imagetools inspect "$IMAGE:$version"
