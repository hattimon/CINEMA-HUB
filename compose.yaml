services:
  cinema:
    build: .
    image: ${APP_IMAGE:-ghcr.io/hattimon/cinema-hub:1.3.10}
    restart: unless-stopped
    init: false
    ports:
      - "${LAN_BIND:-0.0.0.0}:${APP_PORT:-8090}:8090"
    volumes:
      - cinema-state:/data
    environment:
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
volumes:
  cinema-state:
