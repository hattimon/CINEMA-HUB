name: cinema-hub
services:
  cinema:
    image: ${APP_IMAGE:-ghcr.io/hattimon/cinema-hub:1.3.5}
    build: .
    restart: unless-stopped
    ports:
      - "${LAN_BIND:-0.0.0.0}:${APP_PORT:-8090}:8090"
    volumes:
      - cinema-state:/data
    environment:
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    shm_size: 512mb
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 25s
volumes:
  cinema-state:
