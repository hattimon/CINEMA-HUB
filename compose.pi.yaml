name: cinema-hub
services:
  cinema:
    build:
      context: .
      dockerfile: Dockerfile.pi
    image: cinema-hub:rpi
    restart: unless-stopped
    ports:
      - "${LAN_BIND:-192.168.11.20}:${APP_PORT:-9999}:8090"
    volumes:
      - "${CINEMA_DATA_DIR:-/mnt/nvme/apps/cinema-hub/data}:/data"
    environment:
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256mb
    cpus: 2.0
    mem_limit: 1536m
    mem_reservation: 256m
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 25s
